<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecitech - Gráfico de Temperatura</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght=300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../estilos/temperatura.css">
</head>
<body>

    <header class="header">
        <div class="logo-container">
            <img src="lecita.png" alt="Logo Escola Lecita" class="logo-img">
            <h1 class="logo-texto">LECITECH</h1>
        </div>
        <nav class="navegacao">
            <a href="monitoramento.html" class="nav-link">Monitoramento</a>
            <a href="dashboard.html" class="nav-link ativo">Dashboard (Gráficos)</a>
            <a href="historico.html" class="nav-link">Histórico</a>
            <a href="projeto.html" class="nav-link">Sobre o Projeto</a>
        </nav>
        <div class="status-estacao">
            <span class="ponto-verde"></span> Online <span id="online-count">(--)</span>
        </div>
    </header>

    <main class="container">
        
        <div class="cabecalho-dados">
            <div class="textos-cabecalho">
                <h2>Análise Histórica: Temperatura</h2>
                <p>Variações climáticas registradas em tempo real na região de Manaus.</p>
            </div>
        </div>

        <div class="grafico-card">
            <div class="grafico-header">
                <a href="dashboard.html" class="btn-voltar"><i class="fa-solid fa-arrow-left"></i> Voltar aos Sensores</a>
                <div class="titulo-grafico-container">
                    <h3><i class="fa-solid fa-temperature-half" style="color: #FF4B4B;"></i> Variação de Temperatura (°C)</h3>
                    <span id="valor-atual-destaque" class="valor-destaque">-- °C</span>
                </div>
            </div>
            <p id="chart-meta" style="text-align:center; color:#9ba6b5; font-size:0.82rem; margin: 12px 0 18px;">
                <i class="fa-solid fa-circle-info"></i> Carregando informações do gráfico...
            </p>
            <div class="canvas-container">
                <canvas id="graficoCanvas"></canvas>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="../scripts/temperatura.js"></script>
    <script type="module" src="../scripts/presenca.js"></script>
</body>
</html>
